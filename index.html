const KEY = "shorts2d-pick-v1";
const RKEY = "shorts2d-pick-rank";   // 記録(docs/IDEAS.md)のランクを最後にそろえたときの値
const LABEL = {done: "完了", yes: "要", hold: "保留", no: "不要"};
let st = {}, applied = {};
try { st = JSON.parse(localStorage.getItem(KEY) || "{}"); applied = JSON.parse(localStorage.getItem(RKEY) || "{}"); } catch (e) {}
// 記録のランクが変わった動画(新しく完了になった など)だけ、選びを記録にそろえる
DATA.forEach(v => { if (v.rank && applied[v.name] !== v.rank) { st[v.name] = v.rank; applied[v.name] = v.rank; } });
localStorage.setItem(KEY, JSON.stringify(st));
localStorage.setItem(RKEY, JSON.stringify(applied));
let filter = "all";
const FILTERS = [["all", "全部"], ["none", "未定"], ["done", "完了"], ["yes", "要"], ["hold", "保留"], ["no", "不要"]];

function count() {
  const c = {done: 0, yes: 0, hold: 0, no: 0, none: 0};
  DATA.forEach(v => c[st[v.name] || "none"]++);
  return c;
}
function drawHeader() {
  const c = count();
  document.getElementById("counts").innerHTML =
    `完了 <b>${c.done}</b> ・ 要 <b>${c.yes}</b> ・ 保留 <b>${c.hold}</b> ・ 不要 <b>${c.no}</b> ・ 未定 <b>${c.none}</b>`;
  document.getElementById("filters").innerHTML = FILTERS.map(([k, l]) =>
    `<button class="${filter === k ? "on" : ""}" onclick="setFilter('${k}')">${l}</button>`).join("");
}
function card(v) {
  const s = st[v.name] || "";
  const btn = k => `<button class="${k} ${s === k ? "on" : ""}" onclick="pick('${v.name}','${k}')">${LABEL[k]}</button>`;
  return `<div class="card ${s}" id="c-${v.name}">
<a href="${v.url}" target="_blank" rel="noopener"><img loading="lazy" src="thumbs/${v.name}.jpg" alt=""></a>
<div class="t">${v.i}. ${v.title}</div><div class="d">${v.desc}</div><div class="n">${v.name}</div>
<div class="seg">${btn("done")}${btn("yes")}${btn("hold")}${btn("no")}</div></div>`;
}
function drawGrid() {
  document.getElementById("grid").innerHTML = DATA
    .filter(v => filter === "all" || (st[v.name] || "none") === filter)
    .map(card).join("");
}
function pick(name, k) {
  if (st[name] === k) delete st[name]; else st[name] = k;   // 同じボタンをもう一度押すと未定に戻る
  localStorage.setItem(KEY, JSON.stringify(st));
  drawHeader();
  const el = document.getElementById("c-" + name);
  const v = DATA.find(x => x.name === name);
  if (filter !== "all" && (st[name] || "none") !== filter) { el.remove(); return; }
  el.outerHTML = card(v);
}
function setFilter(k) { filter = k; drawHeader(); drawGrid(); window.scrollTo(0, 0); }
function result() {
  const g = {done: [], yes: [], hold: [], no: [], none: []};
  DATA.forEach(v => g[st[v.name] || "none"].push(`${v.i} ${v.name}`));
  return [["完了", g.done], ["要", g.yes], ["保留", g.hold], ["不要", g.no], ["未定", g.none]]
    .map(([l, a]) => `${l}(${a.length}): ${a.join(", ")}`).join("\n");
}
function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.style.display = "block"; setTimeout(() => t.style.display = "none", 1800); }
function send() {
  const d = new Date();
  const title = `絞り込みの結果 ${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`;
  window.open(`https://github.com/seoooma/shorts2d/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(result())}`, "_blank");
}
function copy() {
  const text = result();
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast("コピーしました"), () => prompt("コピーしてください", text));
  else prompt("コピーしてください", text);
}
drawHeader(); drawGrid();
</script>
