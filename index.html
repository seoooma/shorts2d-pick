<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>shorts2d 絞り込み</title>
<style>
:root{--bg:#0b0d12;--card:#151821;--fg:#e8ebf2;--sub:#8a93a6;--yes:#3ddc84;--hold:#f5c542;--no:#ff5a6a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(11,13,18,.96);padding:8px 10px 6px;border-bottom:1px solid #222}
h1{font-size:16px;margin:0 0 4px}
.counts{font-size:13px;color:var(--sub);margin-bottom:6px}
.counts b{color:var(--fg)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.row button{border:1px solid #333;background:#1b1f2a;color:var(--fg);border-radius:16px;padding:6px 11px;font-size:13px}
.row button.on{background:var(--fg);color:#000}
.row .act{border-color:#4a5368}
.note{font-size:11px;color:var(--sub)}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:10px}
.card{background:var(--card);border-radius:10px;overflow:hidden;border:3px solid transparent}
.card.yes{border-color:var(--yes)}.card.hold{border-color:var(--hold)}.card.no{border-color:var(--no);opacity:.45}
.card a{display:block}
.card img{width:100%;aspect-ratio:9/16;display:block;object-fit:cover;background:#000}
.t{font-size:13px;font-weight:600;padding:6px 7px 0;line-height:1.3}
.d{font-size:11px;color:var(--sub);padding:2px 7px 0;line-height:1.35;max-height:4.1em;overflow:hidden}
.n{font-size:10px;color:#5d6577;padding:2px 7px 0}
.seg{display:flex;gap:4px;padding:7px}
.seg button{flex:1;padding:9px 0;border-radius:7px;border:0;background:#232838;color:var(--fg);font-size:14px}
.seg button.yes.on{background:var(--yes);color:#000}.seg button.hold.on{background:var(--hold);color:#000}.seg button.no.on{background:var(--no);color:#000}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#000;padding:8px 14px;border-radius:18px;font-size:14px;display:none;z-index:9}
</style></head><body>
<header>
<h1>shorts2d 絞り込み(30本)</h1>
<div class="counts" id="counts"></div>
<div class="row" id="filters"></div>
<div class="row"><button class="act" onclick="send()">結果を送る(Issue)</button><button class="act" onclick="copy()">結果をコピー</button></div>
<div class="note">サムネを押すと動画(60秒の確認用)が開きます。動画を開くには GitHub へのログインが要ります。選んだ結果はこのブラウザに保存されます。</div>
</header>
<main id="grid"></main>
<div id="toast"></div>
<script>
const DATA = [{"i": 1, "name": "apollonian_gasket", "title": "整数の円のガスケット", "desc": "すき間に接する円を大きい順に入れると、曲率(1/半径)が全部整数。拡大しても整数", "url": "https://github.com/seoooma/shorts2d/releases/download/previews/apollonian_gasket_60s_preview.mp4"}, {"i": 2, "name": "brachistochrone", "title": "最速降下線", "desc": "A から B へ玉を転がす5本の道で競争するとサイクロイドが勝つ。しかもサイクロイドのおわんは、どこから放しても同じ時間で底に着く", "url": "https://github.com/seoooma/shorts2d/releases/download/previews/brachistochrone_60s_preview.mp4"}, {"i": 3, "name": "chladni", "title": "砂が描く模様", "desc": "震える板の上の砂が、揺れない線(節)に集まる", "url": "https://github.com/seoooma/shorts2d/releases/download/previews/chladni_60s_preview.mp4"}, {"i": 4, "name": "clifford_attractor", "title": "形を変える光の霧", "desc": "7つの星が霧に広がり、ねじれ・裂け・また7つの星に縮んで、また霧に", "url": "https://github.com/seoooma/shorts2d/releases/download/previews/clifford_attractor_60s_preview.mp4"}, {"i": 5, "name": "cyclotron", "title": "サイクロトロン", "desc": "同じテンポで押すだけで、粒は速くなりながららせんを描いて飛び出す。重さの違う粒は取り残される", "url": "https://github.com/seoooma/shorts2d/releases/download/previews/cyclotron_60s_preview.mp4"}, {"i": 6, "name": "dragon_fold", "title": "紙を折るドラゴン", "desc": "紙テープを半分に折って開くことをくり返すと、竜の形(ドラゴン曲線)になり、4匹で平面をうめる", "url": "https://github.com/seoooma/shorts2d/releases/download/previews/dragon_fold_60s_preview.mp4"}, {"i": 7, "name": "ellipse_foci", "title": "楕円の焦点で増える玉", "desc": "玉が焦点の○を通るたびに、そこから新しい玉が1個出る", "url": "https://github.com/seoooma/shorts2d/releases/download/previews/ellipse_foci_60s_preview.mp4"}, {"i": 8, "name": "figure_eight_3body", "title": "8の字を追う三体", "desc": "同じ並びから速さを変えて放すと、3つの星が8の字・蝶・蛾・毛糸玉を描いて元に戻る。少しずらすと崩れて1つが飛び去る", "url": "https://github.com/seoooma/shorts2d/releases/download/previews/figure_eight_3body_60s_preview.mp4"}, {"i": 9, "name": "firefly_sync", "title": "ホタルがそろう", "desc": "1000匹がばらばらに光る → 合わせる力 K が臨界をこえると一気に同じ拍 → K を下げるとまたばらばら", "url": "https://github.com/seoooma/shorts2d/releases/download/previews/firefly_sync_60s_preview.mp4"}, {"i": 10, "name": "fourier_circles", "title": "回る円で絵を描く", "desc": "回る円を大きい順に鎖のようにつなぐと、先端が ♪・π・ハート・星を描く(フーリエ級数)", "url": "https://github.com/seoooma/shorts2d/releases/download/previews/fourier_circles_60s_preview.mp4"}, {"i": 11, "name": "genetic_cars", "title": "Genetic algorithm cars", "desc": "40 cars with tiny brains learn to drive a circuit, generation by generation", "url": "https://github.com/seoooma/shorts2d/releases/download/previews/genetic_cars_60s_preview.mp4"}, {"i": 12, "name": "genetic_rockets", "title": "世代ごとに賢くなるロケット", "desc": "遺伝的アルゴリズムで、200機がすき間を見つけてゴールへ", "url": "https://github.com/seoooma/shorts2d/releases/download/previews/genetic_rockets_60s_preview.mp4"}, {"i": 13, "name": "hanoi_music", "title": "ハノイの塔の旋律", "desc": "9枚の円盤を 511 手で右の棒へ。動かす円盤の並びは「ものさし」の目盛りと同じ形", "url": "https://github.com/seoooma/shorts2d/releases/download/previews/hanoi_music_60s_preview.mp4"}, {"i": 14, "name": "life_methuselah", "title": "5マスが1103世代暴れる", "desc": "ライフゲームの R-ペントミノ。たった5マスが増えて、グライダーを撃ち出し、1103世代で静まる", "url": "https://github.com/seoooma/shorts2d/releases/download/previews/life_methuselah_60s_preview.mp4"}, {"i": 15, "name": "logistic_bifurcation", "title": "分岐の音を聴く", "desc": "r を上げると 1→2→4→8→カオス、周期3の窓、拡大すると同じ形", "url": "https://github.com/seoooma/shorts2d/releases/download/previews/logistic_bifurcation_60s_preview.mp4"}, {"i": 16, "name": "mandel_julia", "title": "マンデルブロとジュリア", "desc": "光る点 c が M のふちをなぞると、下のジュリア集合がうさぎ・竜・木の枝に変わり、外へ出ると粉々に", "url": "https://github.com/seoooma/shorts2d/releases/download/previews/mandel_julia_60s_preview.mp4"}, {"i": 17, "name": "maze_solver", "title": "迷路を作って解く", "desc": "穴掘り法で迷路を掘り、入口から幅優先探索で虹色の水を流して、最短の道を光らせる", "url": "https://github.com/seoooma/shorts2d/releases/download/previews/maze_solver_60s_preview.mp4"}, {"i": 18, "name": "pendulum_wave", "title": "振り子の波", "desc": "長さのちがう24本の振り子を同時に放すと、波・列・ばらばらを経て、57秒でぴたりとそろう", "url": "https://github.com/seoooma/shorts2d/releases/download/previews/pendulum_wave_60s_preview.mp4"}, {"i": 19, "name": "penrose_deflation", "title": "終わらないペンローズ", "desc": "10枚の三角形の「太陽」を黄金比で割り続けると、ペンローズのタイルになり、どこまでも拡大できる", "url": "https://github.com/seoooma/shorts2d/releases/download/previews/penrose_deflation_60s_preview.mp4"}, {"i": 20, "name": "perlin_silk", "title": "パーリンノイズの絹糸", "desc": "ノイズの値を「流れの向き」にして2万粒を流すと、軌跡が絹糸のように束になる", "url": "https://github.com/seoooma/shorts2d/releases/download/previews/perlin_silk_60s_preview.mp4"}, {"i": 21, "name": "pi_blocks", "title": "ぶつかる回数がπ", "desc": "壁と2つの箱(Galperin の箱)。重さの比を 1:1 → 1:100 → 1:100² → 1:100³ と上げると、3 → 31 → 314 → 3141 回", "url": "https://github.com/seoooma/shorts2d/releases/download/previews/pi_blocks_60s_preview.mp4"}, {"i": 22, "name": "prime_spirals", "title": "素数のらせん", "desc": "ふるいで残った素数を、四角いらせん(ウラム)から極座標 (半径 n, 角度 n ラジアン) へ移すと、渦と筋が現れる", "url": "https://github.com/seoooma/shorts2d/releases/download/previews/prime_spirals_60s_preview.mp4"}, {"i": 23, "name": "rayleigh_benard", "title": "下から温める水", "desc": "底の熱がキノコ形の柱で一斉に昇り、回る対流になり、火を強めると乱れ、止めると静まる", "url": "https://github.com/seoooma/shorts2d/releases/download/previews/rayleigh_benard_60s_preview.mp4"}, {"i": 24, "name": "ring_escape", "title": "回る輪から逃げる玉", "desc": "20重の回る輪のすき間を、重力で跳ねる玉が抜けるたびに輪が光の粒に砕け、玉が2個に増える", "url": "https://github.com/seoooma/shorts2d/releases/download/previews/ring_escape_60s_preview.mp4"}, {"i": 25, "name": "sandpile", "title": "砂山の曼荼羅", "desc": "真ん中に砂を落とし続け、4粒たまった所は上下左右へ1粒ずつ配る(アーベルの砂山モデル)", "url": "https://github.com/seoooma/shorts2d/releases/download/previews/sandpile_60s_preview.mp4"}, {"i": 26, "name": "snake_hamilton", "title": "画面を埋めつくすヘビ", "desc": "ハミルトン閉路と安全な近道のスネーク AI が、18×32 の 576 マスを全部ヘビにする", "url": "https://github.com/seoooma/shorts2d/releases/download/previews/snake_hamilton_60s_preview.mp4"}, {"i": 27, "name": "sorting_rainbow", "title": "並べ替えの虹", "desc": "円の周りの360本の棒(長さと色が値)を、5つのアルゴリズムで順に並べ替える", "url": "https://github.com/seoooma/shorts2d/releases/download/previews/sorting_rainbow_60s_preview.mp4"}, {"i": 28, "name": "swarmalators", "title": "動いて そろう粒", "desc": "1000粒が、2つのつまみ J・K の切り替えで 1色の円盤 → 虹の輪 → ちぎれた扇 → 回る輪 に変身する", "url": "https://github.com/seoooma/shorts2d/releases/download/previews/swarmalators_60s_preview.mp4"}, {"i": 29, "name": "tetris_ai", "title": "AIがテトリスで1000行消す", "desc": "全部の置き方を Dellacherie の評価関数で採点して、いちばん点の高い所に置く", "url": "https://github.com/seoooma/shorts2d/releases/download/previews/tetris_ai_60s_preview.mp4"}, {"i": 30, "name": "times_table_circle", "title": "円の掛け算表", "desc": "円の上の200個の点で、k 番と m×k 番(200で割った余り)を線で結ぶ。m を増やすと形が次々に変わる", "url": "https://github.com/seoooma/shorts2d/releases/download/previews/times_table_circle_60s_preview.mp4"}];
const KEY = "shorts2d-pick-v1";
const LABEL = {yes: "要", hold: "保留", no: "不要"};
let st = {};
try { st = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
let filter = "all";
const FILTERS = [["all", "全部"], ["none", "未定"], ["yes", "要"], ["hold", "保留"], ["no", "不要"]];

function count() {
  const c = {yes: 0, hold: 0, no: 0, none: 0};
  DATA.forEach(v => c[st[v.name] || "none"]++);
  return c;
}
function drawHeader() {
  const c = count();
  document.getElementById("counts").innerHTML =
    `要 <b>${c.yes}</b> ・ 保留 <b>${c.hold}</b> ・ 不要 <b>${c.no}</b> ・ 未定 <b>${c.none}</b>`;
  document.getElementById("filters").innerHTML = FILTERS.map(([k, l]) =>
    `<button class="${filter === k ? "on" : ""}" onclick="setFilter('${k}')">${l}</button>`).join("");
}
function card(v) {
  const s = st[v.name] || "";
  const btn = k => `<button class="${k} ${s === k ? "on" : ""}" onclick="pick('${v.name}','${k}')">${LABEL[k]}</button>`;
  return `<div class="card ${s}" id="c-${v.name}">
<a href="${v.url}" target="_blank" rel="noopener"><img loading="lazy" src="thumbs/${v.name}.jpg" alt=""></a>
<div class="t">${v.i}. ${v.title}</div><div class="d">${v.desc}</div><div class="n">${v.name}</div>
<div class="seg">${btn("yes")}${btn("hold")}${btn("no")}</div></div>`;
}
function drawGrid() {
  document.getElementById("grid").innerHTML = DATA
    .filter(v => filter === "all" || (st[v.name] || "none") === filter)
    .map(card).join("");
}
function pick(name, k) {
  if (st[name] === k) delete st[name]; else st[name] = k;   // 同じボタンをもう一度押すと未定に戻る
  localStorage.setItem(KEY, JSON.stringify(st));
  drawHeader();
  const el = document.getElementById("c-" + name);
  const v = DATA.find(x => x.name === name);
  if (filter !== "all" && (st[name] || "none") !== filter) { el.remove(); return; }
  el.outerHTML = card(v);
}
function setFilter(k) { filter = k; drawHeader(); drawGrid(); window.scrollTo(0, 0); }
function result() {
  const g = {yes: [], hold: [], no: [], none: []};
  DATA.forEach(v => g[st[v.name] || "none"].push(`${v.i} ${v.name}`));
  return [["要", g.yes], ["保留", g.hold], ["不要", g.no], ["未定", g.none]]
    .map(([l, a]) => `${l}(${a.length}): ${a.join(", ")}`).join("\n");
}
function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.style.display = "block"; setTimeout(() => t.style.display = "none", 1800); }
function send() {
  const d = new Date();
  const title = `絞り込みの結果 ${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`;
  window.open(`https://github.com/seoooma/shorts2d/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(result())}`, "_blank");
}
function copy() {
  const text = result();
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast("コピーしました"), () => prompt("コピーしてください", text));
  else prompt("コピーしてください", text);
}
drawHeader(); drawGrid();
</script>
</body></html>
